<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>甲状腺术后复查记录表（可视化）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #f5f7fa;
      padding: 20px;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
      font-size: 24px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .form-item {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 14px;
      margin-bottom: 6px;
      color: #444;
      font-weight: 500;
    }
    input {
      padding: 9px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 15px;
    }
    input:focus {
      outline: none;
      border-color: #409eff;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    button {
      padding: 10px 22px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    #saveBtn {
      background-color: #409eff;
      color: #fff;
    }
    #clearAllBtn {
      background-color: #f56c6c;
      color: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ebeef5;
      padding: 10px 8px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #ecf5ff;
      color: #2c3e50;
    }
    .status-normal {
      color: #00b42a;
      font-weight: bold;
    }
    .status-risk {
      color: #f53f3f;
      font-weight: bold;
      background: #ffebee;
    }
    .charts-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    @media(max-width: 992px) {
      .charts-wrap {
        grid-template-columns: 1fr;
      }
    }
    canvas {
      max-height: 380px;
    }
    .del-btn {
      background: #ff7d7d;
      color: white;
      padding: 4px 8px;
      font-size: 12px;
    }
    .tips {
      background: #fff7e6;
      border-left: 4px solid #ff7d00;
      padding: 12px 16px;
      margin-bottom: 15px;
      border-radius: 4px;
      font-size: 14px;
      color: #d46b08;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>甲状腺术后复查指标记录表（自动风险判定+趋势可视化）</h1>

  <div class="tips">
    ⚠️ 高危异常指标自动标红风险提示；数据保存在当前浏览器本地，换浏览器/无痕模式数据不互通；可多次录入、永久留存、查看历次变化曲线
  </div>

  <!-- 录入表单区域 -->
  <div class="card">
    <h3 style="margin-bottom:16px;">新增一次复查记录</h3>
    <div class="row">
      <div class="form-item">
        <label>复查日期</label>
        <input type="date" id="checkDate" required>
      </div>
      <div class="form-item">
        <label>钙 (mmol/L)</label>
        <input type="number" step="0.01" id="calcium" placeholder="正常:2.10-2.55">
      </div>
      <div class="form-item">
        <label>无机磷 (mmol/L)</label>
        <input type="number" step="0.01" id="phosphorus" placeholder="正常:0.96-1.62">
      </div>
      <div class="form-item">
        <label>TSH (mIU/L)</label>
        <input type="number" step="0.001" id="tsh" placeholder="术后目标分层">
      </div>
      <div class="form-item">
        <label>FT3 (pmol/L)</label>
        <input type="number" step="0.01" id="ft3" placeholder="正常:3.1-6.8">
      </div>
      <div class="form-item">
        <label>FT4 (pmol/L)</label>
        <input type="number" step="0.01" id="ft4" placeholder="正常:12-22">
      </div>
      <div class="form-item">
        <label>TGAb (IU/mL)</label>
        <input type="number" step="1" id="tgab" placeholder="正常＜115">
      </div>
      <div class="form-item">
        <label>TPOAb (IU/mL)</label>
        <input type="number" step="1" id="tpoab" placeholder="正常＜34">
      </div>
      <div class="form-item">
        <label>TG (ng/mL)</label>
        <input type="number" step="0.01" id="tg" placeholder="术后关键监测">
      </div>
      <div class="form-item">
        <label>PTH (pg/mL)</label>
        <input type="number" step="0.1" id="pth" placeholder="正常:15-65">
      </div>
    </div>
    <div class="btn-group">
      <button id="saveBtn">保存本次复查记录</button>
      <button id="clearAllBtn">清空全部本地数据</button>
    </div>
  </div>

  <!-- 历史记录表格 -->
  <div class="card">
    <h3 style="margin-bottom:12px;">历次复查完整记录（异常标红）</h3>
    <table id="recordTable">
      <thead>
        <tr>
          <th>复查日期</th>
          <th>钙</th>
          <th>无机磷</th>
          <th>TSH</th>
          <th>FT3</th>
          <th>FT4</th>
          <th>TGAb</th>
          <th>TPOAb</th>
          <th>TG</th>
          <th>PTH</th>
          <th>综合状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- 可视化图表 -->
  <div class="card">
    <h3 style="margin-bottom:16px;">指标趋势可视化曲线</h3>
    <div class="charts-wrap">
      <div><canvas id="chart1"></canvas></div>
      <div><canvas id="chart2"></canvas></div>
    </div>
  </div>
</div>

<script>
// ===================== 1. 参考正常范围配置 =====================
const refRange = {
  calcium: { min: 2.10, max: 2.55, name: "钙" },
  phosphorus: { min: 0.96, max: 1.62, name: "无机磷" },
  ft3: { min: 3.1, max: 6.8, name: "FT3" },
  ft4: { min: 12, max: 22, name: "FT4" },
  tgab: { min: 0, max: 115, name: "TGAb" },
  tpoab: { min: 0, max: 34, name: "TPOAb" },
  pth: { min: 15, max: 65, name: "PTH" }
};

// 高危判定规则（甲状腺术后专用）
function getSingleStatus(key, val) {
  if(val === '' || val === null || isNaN(val)) return 'empty';
  const num = Number(val);
  if(!refRange[key]) return 'normal';
  const {min, max} = refRange[key];
  if(num < min) return 'low';
  if(num > max) return 'high';
  return 'normal';
}

// 综合是否存在风险
function checkHasRisk(item) {
  const keys = Object.keys(refRange);
  for(let k of keys) {
    const st = getSingleStatus(k, item[k]);
    if(st === 'low' || st === 'high') return true;
  }
  // TSH、TG单独高危逻辑（甲癌术后）
  const tsh = Number(item.tsh);
  const tg = Number(item.tg);
  // 高危患者TSH未达标、TG升高视为风险
  if(!isNaN(tsh) && tsh > 0.5) return true;
  if(!isNaN(tg) && tg > 1) return true;
  return false;
}

// ===================== 2. 本地存储操作 =====================
const STORAGE_KEY = 'thyroidCheckRecords';
function getRecords() {
  const str = localStorage.getItem(STORAGE_KEY);
  return str ? JSON.parse(str) : [];
}
function saveRecords(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

// ===================== 3. 渲染表格 =====================
function renderTable() {
  const list = getRecords();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  if(list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="12">暂无复查记录，请录入第一条数据</td></tr>';
    renderChart();
    return;
  }

  list.forEach((item, idx) => {
    const tr = document.createElement('tr');
    const risk = checkHasRisk(item);
    const statusText = risk ? '<span class="status-risk">高危异常</span>' : '<span class="status-normal">全部正常</span>';

    const cellData = [
      item.checkDate,
      formatCell('calcium', item.calcium),
      formatCell('phosphorus', item.phosphorus),
      item.tsh || '-',
      formatCell('ft3', item.ft3),
      formatCell('ft4', item.ft4),
      formatCell('tgab', item.tgab),
      formatCell('tpoab', item.tpoab),
      item.tg || '-',
      formatCell('pth', item.pth),
      statusText
    ];
    cellData.forEach(txt => {
      const td = document.createElement('td');
      td.innerHTML = txt;
      tr.appendChild(td);
    });
    // 删除按钮
    const tdDel = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.innerText = '删除';
    delBtn.onclick = () => {
      const arr = getRecords();
      arr.splice(idx, 1);
      saveRecords(arr);
      renderTable();
    };
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);
    tbody.appendChild(tr);
  });
  renderChart();
}

// 单元格标色
function formatCell(key, val) {
  if(val === '' || val == null) return '-';
  const st = getSingleStatus(key, val);
  const v = Number(val).toFixed(2);
  if(st === 'low' || st === 'high') {
    return `<span class="status-risk">${v}</span>`;
  }
  return `<span class="status-normal">${v}</span>`;
}

// ===================== 4. Chart.js 趋势绘图 =====================
let chart1, chart2;
function renderChart() {
  const list = getRecords();
  const dates = list.map(d => d.checkDate);
  if(list.length < 2) {
    destroyChart();
    return;
  }
  destroyChart();

  // 图表1：钙、磷、PTH、FT3、FT4
  const ctx1 = document.getElementById('chart1').getContext('2d');
  chart1 = new Chart(ctx1, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [
        {label:'钙', data:list.map(i=>i.calcium), borderColor:'#409eff', tension:0.2},
        {label:'无机磷', data:list.map(i=>i.phosphorus), borderColor:'#67c23a', tension:0.2},
        {label:'PTH', data:list.map(i=>i.pth), borderColor:'#e6a23c', tension:0.2},
        {label:'FT3', data:list.map(i=>i.ft3), borderColor:'#9b59b6', tension:0.2},
        {label:'FT4', data:list.map(i=>i.ft4), borderColor:'#e74c3c', tension:0.2}
      ]
    },
    options: {responsive:true, maintainAspectRatio:false, plugins:{title:{display:true, text:'血钙、磷、PTH、甲功激素趋势'}}
  });

  // 图表2：TSH、TG、TGAb、TPOAb
  const ctx2 = document.getElementById('chart2').getContext('2d');
  chart2 = new Chart(ctx2, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [
        {label:'TSH', data:list.map(i=>i.tsh), borderColor:'#1f2937', tension:0.2},
        {label:'TG', data:list.map(i=>i.tg), borderColor:'#f43f5e', tension:0.2},
        {label:'TGAb', data:list.map(i=>i.tgab), borderColor:'#0ea5e9', tension:0.2},
        {label:'TPOAb', data:list.map(i=>i.tpoab), borderColor:'#84cc16', tension:0.2}
      ]
    },
    options: {responsive:true, maintainAspectRatio:false, plugins:{title:{display:true, text:'TSH、Tg、抗体指标趋势'}}
  });
}

function destroyChart() {
  if(chart1) chart1.destroy();
  if(chart2) chart2.destroy();
}

// ===================== 5. 按钮事件绑定 =====================
document.getElementById('saveBtn').addEventListener('click', function(){
  const item = {
    checkDate: document.getElementById('checkDate').value,
    calcium: document.getElementById('calcium').value,
    phosphorus: document.getElementById('phosphorus').value,
    tsh: document.getElementById('tsh').value,
    ft3: document.getElementById('ft3').value,
    ft4: document.getElementById('ft4').value,
    tgab: document.getElementById('tgab').value,
    tpoab: document.getElementById('tpoab').value,
    tg: document.getElementById('tg').value,
    pth: document.getElementById('pth').value
  };
  if(!item.checkDate) {
    alert('请选择复查日期！');
    return;
  }
  const arr = getRecords();
  arr.push(item);
  saveRecords(arr);
  alert('本次复查记录保存成功！');
  // 清空输入框
  document.querySelectorAll('input').forEach(inp=>inp.value='');
  renderTable();
});

document.getElementById('clearAllBtn').addEventListener('click', function(){
  if(confirm('确定要永久清空本机所有复查数据？无法恢复！')) {
    localStorage.removeItem(STORAGE_KEY);
    renderTable();
    alert('全部数据已清空');
  }
});

// 页面初始化加载
window.onload = function(){
  renderTable();
  // 默认选中今天日期
  document.getElementById('checkDate').valueAsDate = new Date();
}
</script>
</body>
</html>
