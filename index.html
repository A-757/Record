<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>甲状腺术后复查记录表</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 12px;
            max-width: 100%;
            margin: 0 auto;
            font-size: 16px;
            line-height: 1.5;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 600;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }
        .form-title {
            font-size: 17px;
            color: #34495e;
            margin-bottom: 12px;
            border-left: 4px solid #3498db;
            padding-left: 10px;
            font-weight: 600;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .form-item {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 500;
        }
        input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            -webkit-appearance: none;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            -webkit-appearance: none;
            min-width: 100px;
            flex: 1;
        }
        .btn-add { background-color: #27ae60; color: #fff; }
        .btn-clear { background-color: #e74c3c; color: #fff; }
        .btn-ref { background-color: #9b59b6; color: #fff; }
        .btn-export { background-color: #2980b9; color: #fff; }
        .btn-import { background-color: #f39c12; color: #fff; }
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            min-width: 600px;
        }
        th, td {
            border: 1px solid #eee;
            padding: 10px 6px;
            text-align: center;
            font-size: 13px;
            white-space: nowrap;
        }
        th {
            background-color: #3498db;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .normal {
            color: #27ae60;
            font-weight: 500;
        }
        .danger {
            color: #e74c3c;
            font-weight: bold;
            background-color: #ffeaea;
        }
        .chart-box {
            height: 320px;
            margin-top: 10px;
        }
        .tip {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            line-height: 1.4;
        }
        input[type="file"] {
            display: none;
        }
        .mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #333;
        }
        .ref-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .ref-grid .form-item > div {
            display: flex;
            gap: 8px;
        }
        .modal-btn-group {
            display: flex;
            gap: 10px;
        }
        .modal-btn-group button {
            flex: 1;
        }
        /* 微信导出提示弹窗 */
        .wx-tip {
            position: fixed;
            left: 15px;
            right: 15px;
            bottom: 20px;
            background: #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <h1>甲状腺术后复查记录表</h1>

    <div class="card">
        <div class="form-title">新增复查数据</div>
        <div class="form-grid">
            <div class="form-item">
                <label>复查日期</label>
                <input type="date" id="recordDate" required>
            </div>
            <div class="form-item">
                <label>钙</label>
                <input type="number" step="0.01" id="calcium" placeholder="输入数值">
            </div>
            <div class="form-item">
                <label>无机磷</label>
                <input type="number" step="0.01" id="phosphorus" placeholder="输入数值">
            </div>
            <div class="form-item">
                <label>TSH</label>
                <input type="number" step="0.01" id="tsh" placeholder="输入数值">
            </div>
            <div class="form-item">
                <label>FT3</label>
                <input type="number" step="0.01" id="ft3" placeholder="输入数值">
            </div>
            <div class="form-item">
                <label>FT4</label>
                <input type="number" step="0.01" id="ft4" placeholder="输入数值">
            </div>
            <div class="form-item">
                <label>TGAb</label>
                <input type="number" step="0.01" id="tgab" placeholder="输入数值">
            </div>
            <div class="form-item">
                <label>TPOAb</label>
                <input type="number" step="0.01" id="tpoab" placeholder="输入数值">
            </div>
            <div class="form-item">
                <label>TG 甲状腺球蛋白</label>
                <input type="number" step="0.01" id="tg" placeholder="输入数值">
            </div>
            <div class="form-item">
                <label>PTH 甲状旁腺激素</label>
                <input type="number" step="0.01" id="pth" placeholder="输入数值">
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-add" onclick="addRecord()">保存本次复查数据</button>
            <button class="btn-clear" onclick="clearAllData()">清空全部记录</button>
            <button class="btn-export" onclick="exportData()">导出全部数据</button>
            <button class="btn-import" onclick="document.getElementById('fileInput').click()">导入备份数据</button>
            <button class="btn-ref" onclick="openRefModal()">设置参考范围</button>
            <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
        </div>
        <p class="tip">💡 数据本地永久保存；红色=指标异常；导出可备份，导入可恢复历史记录</p>
    </div>

    <div class="card">
        <div class="form-title">复查历史记录</div>
        <div class="table-wrap">
            <table id="recordTable">
                <thead>
                    <tr>
                        <th>操作</th>
                        <th>复查日期</th>
                        <th>钙</th>
                        <th>无机磷</th>
                        <th>TSH</th>
                        <th>FT3</th>
                        <th>FT4</th>
                        <th>TGAb</th>
                        <th>TPOAb</th>
                        <th>TG</th>
                        <th>PTH</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="form-title">指标趋势走势图</div>
        <div class="chart-box">
            <canvas id="dataChart"></canvas>
        </div>
    </div>

    <div class="mask" id="refMask">
        <div class="modal">
            <h3>指标参考范围设置</h3>
            <div class="ref-grid" id="refPanel"></div>
            <div class="modal-btn-group">
                <button class="btn-ref" onclick="saveReference()">保存设置</button>
                <button style="background:#999;color:#fff" onclick="closeRefModal()">关闭</button>
            </div>
        </div>
    </div>

    <div class="wx-tip" id="wxTip"></div>

    <script>
        const defaultRef = {
            calcium: { min: 2.10, max: 2.60, name: "钙" },
            phosphorus: { min: 0.96, max: 1.62, name: "无机磷" },
            tsh: { min: 0.27, max: 4.20, name: "TSH" },
            ft3: { min: 3.10, max: 6.80, name: "FT3" },
            ft4: { min: 12.00, max: 22.00, name: "FT4" },
            tgab: { min: 0.00, max: 10.00, name: "TGAb" },
            tpoab: { min: 0.00, max: 34.00, name: "TPOAb" },
            tg: { min: 3.5, max: 77, name: "TG" },
            pth: { min: 15, max: 68, name: "PTH" }
        };
        const keyList = Object.keys(defaultRef);
        let chartInstance = null;

        // 判断是否微信浏览器
        function isWeChat() {
            return /micromessenger/i.test(navigator.userAgent);
        }

        function openRefModal() {
            document.getElementById('refMask').style.display = 'flex';
            renderRefPanel();
        }
        function closeRefModal() {
            document.getElementById('refMask').style.display = 'none';
        }

        function getLocal(key) {
            const val = localStorage.getItem(key);
            return val ? JSON.parse(val) : null;
        }
        function setLocal(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        function getReference() {
            let ref = getLocal('thyroidRef');
            return ref ? ref : JSON.parse(JSON.stringify(defaultRef));
        }
        function saveReference() {
            const ref = {};
            keyList.forEach(key => {
                const minVal = parseFloat(document.getElementById(`${key}_min`).value) || 0;
                const maxVal = parseFloat(document.getElementById(`${key}_max`).value) || 9999;
                ref[key] = {
                    min: minVal,
                    max: maxVal,
                    name: defaultRef[key].name
                };
            });
            setLocal('thyroidRef', ref);
            alert("参考范围保存成功！");
            closeRefModal();
            renderTable();
            renderChart();
        }

        function renderRefPanel() {
            const ref = getReference();
            const panel = document.getElementById('refPanel');
            panel.innerHTML = '';
            keyList.forEach(key => {
                const item = ref[key];
                const div = document.createElement('div');
                div.className = 'form-item';
                div.innerHTML = `
                    <label>${item.name} 下限 / 上限</label>
                    <div>
                        <input type="number" step="0.01" id="${key}_min" value="${item.min}">
                        <input type="number" step="0.01" id="${key}_max" value="${item.max}">
                    </div>
                `;
                panel.appendChild(div);
            });
        }

        function getRecordData() {
            let data = localStorage.getItem('thyroidRecord');
            return data ? JSON.parse(data) : [];
        }
        function saveRecordData(arr) {
            localStorage.setItem('thyroidRecord', JSON.stringify(arr));
        }

        function isAbnormal(val, min, max) {
            const num = parseFloat(val);
            if (isNaN(num)) return false;
            return num < min || num > max;
        }

        function addRecord() {
            const date = document.getElementById('recordDate').value;
            if (!date) {
                alert("请选择复查日期！");
                return;
            }
            const record = {
                date: date,
                calcium: document.getElementById('calcium').value,
                phosphorus: document.getElementById('phosphorus').value,
                tsh: document.getElementById('tsh').value,
                ft3: document.getElementById('ft3').value,
                ft4: document.getElementById('ft4').value,
                tgab: document.getElementById('tgab').value,
                tpoab: document.getElementById('tpoab').value,
                tg: document.getElementById('tg').value,
                pth: document.getElementById('pth').value
            };
            let list = getRecordData();
            list.push(record);
            saveRecordData(list);
            alert("数据保存成功！");
            document.querySelectorAll('input[type="number"]').forEach(el => el.value = '');
            renderTable();
            renderChart();
        }

        function delRecord(index) {
            let list = getRecordData();
            list.splice(index, 1);
            saveRecordData(list);
            renderTable();
            renderChart();
        }

        function clearAllData() {
            if (confirm("确定清空所有复查记录？此操作不可恢复！")) {
                localStorage.removeItem('thyroidRecord');
                renderTable();
                renderChart();
            }
        }

        // 导出：微信→复制到剪贴板；普通浏览器→正常下载
        function exportData() {
            const list = getRecordData();
            if (list.length === 0) {
                alert("暂无数据可导出！");
                return;
            }
            const jsonStr = JSON.stringify(list, null, 2);
            const fileName = `甲状腺复查记录_${new Date().toLocaleDateString()}.json`;

            if (isWeChat()) {
                // 微信：复制到剪贴板
                navigator.clipboard.writeText(jsonStr).then(() => {
                    const tip = document.getElementById('wxTip');
                    tip.innerText = "已复制到剪贴板！请粘贴到记事本，保存为 " + fileName;
                    tip.style.display = "block";
                    setTimeout(() => tip.style.display = "none", 4000);
                }).catch(() => {
                    alert("微信复制失败，请在右上角「...」→「在浏览器打开」后再导出");
                });
            } else {
                // 普通浏览器：正常下载
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (!Array.isArray(data)) throw new Error("格式错误");
                    saveRecordData(data);
                    alert("数据导入成功！");
                    renderTable();
                    renderChart();
                } catch (err) {
                    alert("文件格式错误，请选择正确的备份JSON文件！");
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const list = getRecordData();
            const ref = getReference();
            tbody.innerHTML = '';
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11">暂无复查记录，请录入数据</td></tr>';
                return;
            }
            list.forEach((item, idx) => {
                let tr = document.createElement('tr');
                let html = `<td><button style="background:#f39c12;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:12px" onclick="delRecord(${idx})">删除</button></td>`;
                html += `<td>${item.date}</td>`;
                keyList.forEach(key => {
                    const val = item[key] || "-";
                    const r = ref[key];
                    let cls = "normal";
                    if (val !== "-" && isAbnormal(val, r.min, r.max)) {
                        cls = "danger";
                    }
                    html += `<td class="${cls}">${val}</td>`;
                });
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function renderChart() {
            const list = getRecordData();
            const ref = getReference();
            const ctx = document.getElementById('dataChart').getContext('2d');
            const labels = list.map(item => item.date);
            if (chartInstance) chartInstance.destroy();

            const datasets = keyList.map((key, idx) => {
                const color = `hsl(${idx * 36}, 70%, 50%)`;
                return {
                    label: ref[key].name,
                    data: list.map(item => parseFloat(item[key]) || null),
                    borderColor: color,
                    backgroundColor: color + '33',
                    fill: false,
                    tension: 0.2
                };
            });

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: { title: { display: true, text: "检测数值", font: { size: 12 } }, ticks: { font: { size: 10 } } },
                        x: { title: { display: true, text: "复查日期", font: { size: 12 } }, ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 45 } }
                    }
                }
            });
        }

        window.onload = function() {
            document.getElementById('recordDate').valueAsDate = new Date();
            renderTable();
            renderChart();
        }
    </script>
</body>
</html>
